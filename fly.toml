# fly.toml app configuration file generated for coordinated-activity-detector on 2026-11-05T21:58:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'coordinated-activity-detector'
primary_region = 'fra'
swap_size_mb = 512

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTH_TRUST_HOST = 'true'
  DATABASE_PATH = '/data/coordination.db'
  IDLE_TIMEOUT_MINUTES = '15'

[[mounts]]
  source = 'coordination_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 150
    soft_limit = 100

[[restart]]
  policy = 'on-failure'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
